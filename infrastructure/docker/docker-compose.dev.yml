services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  api:
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../../backend:/app
    environment:
      LOG_FORMAT: text
    deploy:
      resources:
        limits: {}

  llm-service:
    ports:
      - "8001:8001"
    volumes:
      - ../../backend:/app
      - ../../models:/models:ro
    environment:
      LOG_FORMAT: text
    deploy:
      resources:
        limits: {}

  stt-service:
    ports:
      - "8002:8002"
    volumes:
      - ../../backend:/app
      - ../../models:/models:ro
    environment:
      LOG_FORMAT: text
    deploy:
      resources:
        limits: {}

  tts-service:
    ports:
      - "8003:8003"
    volumes:
      - ../../backend:/app
      - ../../models:/models:ro
    environment:
      LOG_FORMAT: text
    deploy:
      resources:
        limits: {}

  telephony-service:
    ports:
      - "8004:8004"
    volumes:
      - ../../backend:/app
    environment:
      LOG_FORMAT: text
    deploy:
      resources:
        limits: {}

  ai-orchestration:
    ports:
      - "8005:8005"
    volumes:
      - ../../backend:/app
    environment:
      LOG_FORMAT: text
    deploy:
      resources:
        limits: {}

  rag-service:
    ports:
      - "8006:8006"
    volumes:
      - ../../backend:/app
      - ../../models:/models:ro
    environment:
      LOG_FORMAT: text
    deploy:
      resources:
        limits: {}
