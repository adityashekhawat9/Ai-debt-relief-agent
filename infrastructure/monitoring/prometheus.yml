global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ai-voice-platform'
    env: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: 'llm-service'
    static_configs:
      - targets: ['llm-service:8001']
    metrics_path: /metrics

  - job_name: 'stt-service'
    static_configs:
      - targets: ['stt-service:8002']
    metrics_path: /metrics

  - job_name: 'tts-service'
    static_configs:
      - targets: ['tts-service:8003']
    metrics_path: /metrics

  - job_name: 'telephony-service'
    static_configs:
      - targets: ['telephony-service:8004']
    metrics_path: /metrics

  - job_name: 'ai-orchestration'
    static_configs:
      - targets: ['ai-orchestration:8005']
    metrics_path: /metrics

  - job_name: 'rag-service'
    static_configs:
      - targets: ['rag-service:8006']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
